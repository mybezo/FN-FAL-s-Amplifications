name: Build with Maven and Do Runtime Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        
    - name: Maven Build
      run: mvn -B clean package --file pom.xml

    - name: Compile against latest API (26.x)
      run: mvn -B compile --file pom.xml -Dspigot.version=26.3-R0.1-SNAPSHOT -Dproject.build.directory=target-26x
      
    - name: Upload the artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ github.event.number }}
        path: 'target/FNAmplifications*.jar'
  
  runtime-test:
    name: Plugin Runtime Test 
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mcVersion: '1.21.1'
            javaVersion: '21'
          - mcVersion: '1.21.4'
            javaVersion: '21'
          - mcVersion: '1.21.8'
            javaVersion: '21'
          - mcVersion: '1.21.11'
            javaVersion: '21'
          - mcVersion: '26.1.2'
            javaVersion: '25'
    
    steps:        
      - uses: FN-FAL113/minecraft-plugin-runtime-test@v1.1.2
        with:
          server-version: ${{ matrix.mcVersion }}
          java-version: ${{ matrix.javaVersion }}
          artifact-name: artifact-${{ github.event.number }}
